# ============================================================
# Server Configuration
# ============================================================

# The port Tomcat listens on. Default is 8080.
server.port=8080

# Adds a context path prefix to all endpoints.
# With this set, your API becomes: http://localhost:8080/api/...
# We handle /api prefix in @RequestMapping instead, so leave this as /
server.servlet.context-path=/

# ============================================================
# DataSource Configuration
# ============================================================
#
# JDBC (Java Database Connectivity):
# A low-level Java API (set of interfaces) that defines how Java talks to databases.
# You write SQL manually, manage connections, handle ResultSets yourself.
# It's the foundation everything else is built on.
#
# DataSource:
# A factory for database connections. Spring Boot auto-configures a connection pool
# (HikariCP by default) using these properties. HikariCP reuses connections
# instead of opening a new one for every request, which is critical for performance.
#
# JPA (Java Persistence API):
# A specification (set of interfaces) that defines how Java objects map to database tables.
# It abstracts away SQL. You work with Java objects; JPA handles the SQL.
#
# Hibernate:
# The most popular JPA implementation. When you use @Entity, @Column, etc.,
# Hibernate is the engine that actually generates and executes the SQL.
#
# Spring Data JPA:
# A Spring abstraction on top of JPA/Hibernate. Gives you JpaRepository with
# built-in CRUD methods and the ability to derive queries from method names.
# You write almost zero SQL for standard operations.
#
# Summary of the stack:
# Your Code → Spring Data JPA → JPA (interfaces) → Hibernate (implementation) → JDBC → MySQL
# ============================================================

# IMPORTANT: Replace these with your actual MySQL credentials.
# In production, use environment variables (see below).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# The JDBC driver class. Spring Boot can usually detect this automatically
# from the URL, but being explicit is clearer.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================

# ddl-auto controls how Hibernate manages your schema on startup:
# create       → drops and recreates tables every time (destroys data, use only for initial dev)
# create-drop  → creates on start, drops on shutdown (useful for tests)
# update       → adds new columns/tables but never drops existing ones (safe for dev)
# validate     → checks schema matches entities but makes no changes (use in production)
# none         → does nothing (use in production with Flyway/Liquibase)
#
# We use 'update' during development so Hibernate creates the table on first run
# and updates it when we add new fields.
spring.jpa.hibernate.ddl-auto=update

# Prints the generated SQL to the console. Useful for learning and debugging.
# Disable in production to avoid log noise.
spring.jpa.show-sql=true

# Formats the printed SQL to be human-readable (indented).
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which SQL dialect to use for MySQL 8.
# This affects how Hibernate generates certain SQL statements (e.g., pagination, data types).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Application Info
# ============================================================
spring.application.name=employee-management-system

# ============================================================
# Logging Configuration
# ============================================================

# Set log level for our application package to DEBUG during development.
# Levels: TRACE < DEBUG < INFO < WARN < ERROR
logging.level.com.example.employeemanagement=DEBUG

# See the actual SQL parameter values (? placeholders replaced with real values).
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
# Springdoc / Swagger Configuration
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
